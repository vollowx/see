<!doctype html>
<html lang="en" dir="ltr" data-md-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tabs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400;0,17..18,700;1,17..18,400;1,17..18,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./shared.css" />
    <script type="module" src="./shared.ts"></script>
  </head>
  <body>
    <dev-configurator></dev-configurator>

    <div style="width: 500px">
      <md-tabs selected="2">
        <md-tab value="1">
          <md-icon slot="icon">edit</md-icon>
          Tab 1
        </md-tab>
        <md-tab value="2">
          <md-icon slot="icon">edit</md-icon>
          Tab 2
        </md-tab>
        <md-tab value="3">
          <md-icon slot="icon">edit</md-icon>
          Tab 3
        </md-tab>
        <md-tab value="4">
          <md-icon slot="icon">edit</md-icon>
          Tab 4
        </md-tab>
      </md-tabs>
      <md-tab-panel value="1">
        <p>J. Clarkson</p>
      </md-tab-panel>
      <md-tab-panel value="2">
        <p>J. Boar</p>
      </md-tab-panel>
      <md-tab-panel value="3">
        <p>R. Ham</p>
      </md-tab-panel>
      <md-tab-panel value="4">
        <p>Le William</p>
      </md-tab-panel>
    </div>

    <div>
      <md-tabs iconsabove switch="auto" selected="3">
        <md-secondary-tab value="1">
          <md-icon slot="icon">edit</md-icon>
          Tab 1
        </md-secondary-tab>
        <md-secondary-tab value="2">
          <md-icon slot="icon">edit</md-icon>
          Tab 2
        </md-secondary-tab>
        <md-secondary-tab value="3">
          <md-icon slot="icon">edit</md-icon>
          Tab 3
        </md-secondary-tab>
        <md-secondary-tab value="4">
          <md-icon slot="icon">edit</md-icon>
          Tab 4
        </md-secondary-tab>
      </md-tabs>
      <md-tab-panel value="1">
        <p>J. Clarkson</p>
      </md-tab-panel>
      <md-tab-panel value="2">
        <p>J. Boar</p>
      </md-tab-panel>
      <md-tab-panel value="3">
        <p>R. Ham</p>
      </md-tab-panel>
      <md-tab-panel value="4">
        <p>Le William</p>
      </md-tab-panel>
    </div>
  </body>
</html>
